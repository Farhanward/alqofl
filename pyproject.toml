[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alqofl"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "Serverless Ed25519 licensing toolkit."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alqofl = "alqofl.cli:main"

[tool.setuptools]
packages = ["alqofl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
